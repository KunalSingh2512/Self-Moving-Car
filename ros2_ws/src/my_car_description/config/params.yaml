/**:
  ros__parameters:
    # =====================================================
    # 1. SENSOR INPUT TOPICS (Raw Data Streams)
    # =====================================================
    # These are managed by Kunal Singh and Vipul
    topics:
      gnss: "/gnss/fix"          # Standard GNSS NavSatFix
      imu: "/imu/data"           # Raw IMU data
      lidar: "/scan"             # 2D LiDAR Scan or PointCloud
      camera: "/camera/image_raw" # Raw camera feed for Yash & Hritvik

    # =====================================================
    # 2. PERCEPTION OUTPUTS (Read-Only Logs)
    # =====================================================
    # Standardized locations for Yash, Hritvik, and YOLO results
    perception:
      lane_detection: "/perception/lane_lines"   # Yash & Hritvik OpenCV output
      object_detection: "/perception/yolo_boxes" # Your YOLO bounding boxes
      fused_pose: "/ekf/pose"                    # Global world model

    # =====================================================
    # 3. COORDINATE FRAMES (TF Tree)
    # =====================================================
    # Architecturally critical frames for System Integration
    frames:
      global_frame: "map"
      odom_frame: "odom"
      base_link: "base_link"
      lidar_link: "laser_frame"
      camera_link: "camera_link"

    # =====================================================
    # 4. LOCALIZATION & VIRTUAL ORIGIN (Phase 1 Baseline)
    # =====================================================
    # Managed by System Architect (You)
    localization:
      ros__parameters:
        # This is the "Datum" - The GPS coordinate of your Gazebo (0,0,0)
        # Format: [Latitude, Longitude, Yaw/Heading]
        # We use Delhi coordinates as a baseline to match Shuksham's code
        datum: [28.6139, 77.2090, 0.0] 
        
        # Frequency of the EKF and GNSS Transform
        frequency: 30.0
        
        # Wait for the first satellite fix before starting the map
        wait_for_datum: true
        
        # Standard Earth radius for high-precision conversion
        earth_radius: 6371000.0